# ~/.tmux.conf

# ============================================
# GENERAL OPTIONS
# ============================================
set -g mouse on
set -g default-terminal "tmux-256color"
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
%if "#{>=:#{version},3.5}"
set -g extended-keys-format csi-u
%endif

# Each pane spawns inside its own scope under tmux-protected.slice so
# systemd-oomd targets individual panes instead of nuking the whole user
# session and taking the tmux server with it. Slice unit lives at
# ~/.config/systemd/user/tmux-protected.slice.
#
# Falls back to a plain shell if systemd-run fails before running the scope
# helper (no user bus reachable, scope setup fails, etc.) — the bug Codex
# flagged 2026-05-08. The helper removes a marker file just before it execs
# $SHELL, which tells wrapper failure apart from the shell exiting:
# systemd-run returns the shell's exit status, so the old `|| exec $SHELL`
# spawned a second shell whenever `exit` was non-zero. A $SHELL that can't
# exec inside the scope gets no fallback (the fallback would run the same
# $SHELL anyway). Hosts without systemd-run (macOS) start a plain shell.
# Background: https://github.com/tmux/tmux/issues/4151
set -g default-command 'command -v systemd-run >/dev/null 2>&1 || exec $SHELL; m=$(mktemp) || exec $SHELL; systemd-run --user --scope --quiet --slice=tmux-protected.slice /bin/sh -c "rm -f \"\$1\"; exec \"\$0\"" "$SHELL" "$m"; [ -e "$m" ] && { rm -f "$m"; exec $SHELL; }'

# Enable true color support
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-ghostty:RGB"

# ============================================
# CLIPBOARD (OSC 52 to host terminal via SSH)
# ============================================
# Force tmux to emit OSC 52 even when terminfo lacks Ms.
set -s set-clipboard external
set -ag terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'
set -as terminal-features ',xterm-ghostty:clipboard'

# Allow explicit passthrough sequences for terminal integrations that need them.
set -g allow-passthrough on

# vi-style copy mode + mouse drag emits OSC 52
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

# Start windows and panes at 0
set -g base-index 0
setw -g pane-base-index 0

# Renumber windows when one is closed
set -g renumber-windows on

# Increase history limit
set -g history-limit 10000

# ============================================
# KEY BINDINGS
# ============================================
# Change prefix from Ctrl-b to Ctrl-a (more ergonomic)
# Uncomment if you want this:
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# vim-like pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ============================================
# TMUX PLUGIN MANAGER (TPM)
# ============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'

# ============================================
# CATPPUCCIN THEME CONFIGURATION
# ============================================
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style "rounded"

# Status bar configuration
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# ============================================
# INITIALIZE TPM (keep at bottom)
# ============================================
run '~/.tmux/plugins/tpm/tpm'
